    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#242630"/><stop offset="1" stop-color="#101116"/></linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#777b88"/><stop offset="1" stop-color="#393c47"/></linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
